<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Student Records{% endblock %} | Student Record Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-md app-nav" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">Student Records</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint == 'index' }}" href="{{ url_for('index') }}">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint in ('students', 'edit_student') }}" href="{{ url_for('students') }}">Students</a></li>
          <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint == 'add_student' }}" href="{{ url_for('add_student') }}">Add student</a></li>
        </ul>
        <form class="d-flex nav-search" role="search" action="{{ url_for('students') }}" method="get">
          <input class="form-control form-control-sm" type="search" name="q"
                 placeholder="Search students" aria-label="Search students">
          <button class="btn btn-sm btn-light ms-2" type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="container app-footer">
    Student Record Management System &middot; Flask + MySQL
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
